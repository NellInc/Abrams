name: Project webpage

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/project-webpage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-webpage
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # website/verify.py checks names and bundle hashes only. The Git boundary
      # adds the pinned original-input fingerprints, credential patterns and
      # archive-member checks, so originals cannot reach Pages even when the
      # parallel Source-only safeguards run has not finished or has failed.
      - name: Reject originals, private data and credentials in the published tree
        run: python3 -m tools.package.git_boundary
      - name: Verify the isolated webpage
        run: |
          python3 website/verify.py
          node --check website/dist/app.js
          node website/test-maps.cjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the project webpage
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
