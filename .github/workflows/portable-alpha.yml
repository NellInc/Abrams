name: Native portable alpha builds
on:
  workflow_dispatch:
    inputs:
      input_asset_id:
        description: Original-free private release input ZIP asset ID
        required: true
        type: string
      input_sha256:
        description: Reviewed input ZIP SHA-256
        required: true
        type: string
permissions:
  contents: read
jobs:
  fetch:
    # Owner-approved: GitHub requires write-level release access to read a
    # draft asset. GITHUB_TOKEN stays in runner memory for the whole job, so
    # this job runs no third-party packages, no build tools and no input code:
    # only the pinned checkout, gh, the guard below and the artifact upload.
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      INPUT_ASSET: ${{ inputs.input_asset_id }}
      INPUT_SHA256: ${{ inputs.input_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/package/game-inputs.json
            tools/standalone/
          sparse-checkout-cone-mode: false
      - name: Retrieve reviewed original-free input asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$INPUT_ASSET" =~ ^[0-9]+$ ]]
          [[ "$INPUT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/input"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$INPUT_ASSET" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/input/port-input.zip"
      - name: Verify the input is original-free
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,stat,zipfile
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'input/port-input.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==os.environ['INPUT_SHA256'],'Input fingerprint mismatch'
          root=pathlib.Path.cwd().resolve()
          trusted=json.loads((root/'tools/package/game-inputs.json').read_bytes())
          derived=json.loads((root/'tools/standalone/import-derived.json').read_bytes())
          banned={r['sha256'] for r in trusted['files']}
          assert banned,'Checkout original-input inventory is empty'
          # Native apps derive these on the player's machine; the input never carries them.
          banned|={r['sha256'] for r in derived['derived']}
          banned|={'c1821239d91a23883a44c4484ca13091479bf0c75347f01b8cb7b3a089565d05','ff83dc53b33252d42ac624e11a2ce717428b75f48f2e56a20b3d38f78e6ca4ea'}
          excluded={name.lower() for name in derived['excluded']}|{r['path'].lower() for r in derived['derived']}
          prefixes=tuple(prefix.lower() for prefix in derived['excluded_prefixes'])
          assert prefixes,'Checkout native exclusion table is empty'
          with zipfile.ZipFile(archive) as z:
              names=set()
              for member in z.infolist():
                  name=member.filename;p=pathlib.PurePosixPath(name)
                  assert name and not p.is_absolute() and '..' not in p.parts and '\\' not in name and name not in names,'Unsafe ZIP member'
                  names.add(name)
                  assert not stat.S_ISLNK(member.external_attr>>16),'ZIP symlink forbidden'
                  parts=[part.lower() for part in p.parts]
                  # Every component, not only the first: original folders,
                  # reference captures and raw Genesis extracts at any depth.
                  assert parts[0] not in ('game','genesis') and '.git' not in parts,'Original/private directory forbidden: '+name
                  assert 'reference' not in parts[:-1],'Reference capture directory forbidden: '+name
                  assert not any(parts[i:i+2]==['genesis','source'] for i in range(len(parts))),'Raw Genesis extract forbidden: '+name
                  lowered=name.lower()
                  assert not lowered.startswith(prefixes) and lowered.rstrip('/') not in excluded,'Original-derived data forbidden: '+name
                  assert p.name.lower() != 'abrams-ref.zip','Original content archive forbidden'
                  assert not any(part.endswith('.env') or part=='.env' for part in parts),'Secrets forbidden'
                  assert (root/pathlib.Path(*p.parts)).resolve().is_relative_to(root),'Escaping ZIP member'
                  # The build job extracts over its checkout. Workflows, the
                  # native builders, launchers and the hash-locked build
                  # requirements always come from the dispatched ref.
                  assert parts[0] != '.github','Workflow files forbidden: '+name
                  if parts[:2]==['tools','standalone'] and not member.is_dir():
                      local=root/pathlib.Path(*p.parts)
                      assert local.is_file() and local.read_bytes()==z.read(member),'Native build file differs from checkout: '+name
              if 'tools/package/game-inputs.json' in names:assert json.loads(z.read('tools/package/game-inputs.json'))==trusted,'Input inventory differs from checkout'
              for member in z.infolist():
                  if not member.is_dir():assert hashlib.sha256(z.read(member)).hexdigest() not in banned,'Original bytes forbidden: '+member.filename
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: port-input
          path: ${{ runner.temp }}/input/port-input.zip
          if-no-files-found: error
          retention-days: 1
  portable:
    # Every build, test and assemble step runs here with a read-only token.
    needs: fetch
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      INPUT_SHA256: ${{ inputs.input_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Install hash-locked build dependencies
        # Before the input is extracted, so only the checkout's lock applies.
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r tools/standalone/build-requirements.txt
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-gcc
      - name: Add native Windows compiler to PATH
        if: runner.os == 'Windows'
        run: |
          echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"
          echo 'C:\msys64\usr\bin' >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: port-input
          path: ${{ runner.temp }}/input
      - name: Extract the verified input
        run: |
          python - <<'PY'
          import hashlib,os,pathlib,zipfile
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'input/port-input.zip'
          # The artifact must be the exact bytes the fetch job verified.
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==os.environ['INPUT_SHA256'],'Input fingerprint mismatch'
          root=pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(archive) as z:
              for member in z.infolist():
                  assert (root/pathlib.PurePosixPath(member.filename)).resolve().is_relative_to(root),'Escaping ZIP member'
              z.extractall(root)
          PY
      - name: Build pinned upstream baseline and reviewed trace core
        run: |
          git clone --config core.autocrlf=false --config core.eol=lf https://github.com/schellingb/dosbox-pure.git "$RUNNER_TEMP/dosbox-pure"
          git -C "$RUNNER_TEMP/dosbox-pure" checkout --detach 73e03aa145e0549ed4d5a20f8e65532714da33f5
          mkdir -p .runtime/pc-core
          if [[ "$RUNNER_OS" == Windows ]]; then
            make -C "$RUNNER_TEMP/dosbox-pure" -j4 'LDFLAGS=-shared -static -Wl,--gc-sections -fno-ident -Wl,--export-all-symbols'
            cp "$RUNNER_TEMP/dosbox-pure/dosbox_pure_libretro.dll" .runtime/pc-core/source-baseline.dll
          else
            make -C "$RUNNER_TEMP/dosbox-pure" -j4
            cp "$RUNNER_TEMP/dosbox-pure/dosbox_pure_libretro.so" .runtime/pc-core/source-baseline.so
          fi
          python tools/build_pc_trace_core.py --source "$RUNNER_TEMP/dosbox-pure"
      - name: Retrieve fingerprinted official Godot engine
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            URL=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip
            SHA=731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953
          else
            URL=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
            SHA=cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
          fi
          curl --fail --location "$URL" -o "$RUNNER_TEMP/godot.zip"
          GODOT_ZIP_SHA="$SHA" python - <<'PY'
          import hashlib,os,pathlib,zipfile
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'godot.zip'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['GODOT_ZIP_SHA'],'Godot fingerprint mismatch'
          destination=p.parent/'godot';zipfile.ZipFile(p).extractall(destination)
          candidates=[p for p in destination.iterdir() if p.is_file() and (p.name.endswith('win64.exe') if os.name=='nt' else p.name.endswith('linux.x86_64'))]
          assert len(candidates)==1
          engine=candidates[0];engine.chmod(0o755)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('GODOT_PORTABLE='+str(engine)+'\n')
          PY
      - name: Native contracts and original-free core smoke
        run: |
          # Includes the native serialize/restore round trip and the cross-process
          # save lock on this platform; POSIX-only cases skip themselves.
          ABRAMS_PORTABLE_SMOKE=1 python -m unittest tests.test_portable_runtime tests.test_portable_launcher tests.test_standalone_runtime tests.test_pc_bridge tests.test_pc_save_states -v
          if [[ "$RUNNER_OS" != Windows ]]; then
            python -m unittest tests.test_launcher_release_ui -v
          fi
      - name: Godot pipe framing and setup request contracts
        run: |
          LOG="$RUNNER_TEMP/godot-contracts.log"
          "$GODOT_PORTABLE" --headless --audio-driver Dummy --path godot --editor --import 2>&1 | tee "$LOG"
          "$GODOT_PORTABLE" --headless --path godot --script res://tests/test_pc_bridge_transport.gd 2>&1 | tee -a "$LOG"
          "$GODOT_PORTABLE" --headless --audio-driver Dummy --path godot --script res://tests/test_portable_setup.gd 2>&1 | tee -a "$LOG"
          # Godot exits 0 after script parse errors; require the receipts.
          if grep -Eq 'SCRIPT ERROR:|Parse Error:' "$LOG"; then echo 'Godot contract reported a script error' >&2; exit 1; fi
          grep -q 'PC_BRIDGE_TRANSPORT: [0-9]* checks, 0 errors' "$LOG"
          grep -q 'PORTABLE_SETUP_RECOVERY: PASS' "$LOG"
      - name: Assemble self-contained app
        run: |
          PYTHON=$(python -c 'import sys;print(sys.executable)')
          python tools/standalone/portable_build.py --output "builds/Abrams-$RUNNER_OS-x86_64" --godot "$GODOT_PORTABLE" --python "$PYTHON" --cache "$RUNNER_TEMP/portable-freeze" --core-source "$RUNNER_TEMP/dosbox-pure"
          if [[ "$RUNNER_OS" == Windows ]]; then SUFFIX=.dll; else SUFFIX=.so; fi
          python -m tools.standalone.source_bundle --core-suffix "$SUFFIX" --source "$RUNNER_TEMP/dosbox-pure" --output "builds/dosbox-pure-abrams-source-$RUNNER_OS-x86_64.tar.gz"
      - name: Frozen setup and About smoke, audio disabled
        run: |
          APP="$GITHUB_WORKSPACE/builds/Abrams-$RUNNER_OS-x86_64"
          if [[ "$RUNNER_OS" == Windows ]]; then
            RUNTIME="$APP/runtime/AbramsRuntime/AbramsRuntime.exe"
            RENDERER="$APP/renderer/AbramsRenderer.exe"
          else
            RUNTIME="$APP/runtime/AbramsRuntime/AbramsRuntime"
            RENDERER="$APP/renderer/AbramsRenderer"
          fi
          export ABRAMS_DATA_HOME="$RUNNER_TEMP/abrams-smoke-data" ABRAMS_PYTHON="$RUNTIME"
          "$RUNTIME" --status
          python - <<'PY'
          import json, os, pathlib, subprocess
          from tools.standalone.build import APP_NAME
          bundle = pathlib.Path('builds') / ('Abrams-' + os.environ['RUNNER_OS'] + '-x86_64')
          launcher = bundle / (APP_NAME + ('.exe' if os.name == 'nt' else '.sh'))
          subprocess.run([str(launcher.resolve()), '--invoke', '--status'], check=True, timeout=60)
          # The frozen runtime receives a hostile chosen path verbatim and
          # rejects it as an unsupported folder, never as a mangled one. The
          # runtime is called directly: the Windows GUI launcher reports
          # failures in a message box.
          hostile = pathlib.Path(os.environ['RUNNER_TEMP']) / ('Abrams $5 `id` "quoted" folder' if os.name != 'nt' else 'Abrams $5 `id` folder')
          hostile.mkdir()
          result = subprocess.run([os.environ['ABRAMS_PYTHON'], '--launcher', '--invoke', '--game', str(hostile)], capture_output=True, text=True, timeout=600)
          assert result.returncode != 0 and 'Unsupported or missing PC file' in result.stdout, result.stdout + result.stderr
          # Native apps never carry raw extracts or decoded original data.
          manifest = json.loads((bundle / 'RUNTIME.json').read_text())
          assert manifest['derived'] and not (bundle / 'kit/reference').exists() and not (bundle / 'kit/local-art/genesis/source').exists()
          PY
          CHECK_LOG="$RUNNER_TEMP/portable-setup-check.log" SMOKE_LOG="$RUNNER_TEMP/portable-setup-smoke.log"
          "$RENDERER" --headless --audio-driver Dummy --path "$APP/kit/godot" --script res://scripts/portable_setup.gd --check-only 2>&1 | tee "$CHECK_LOG"
          "$RENDERER" --headless --audio-driver Dummy --path "$APP/kit/godot" --script res://scripts/portable_setup.gd -- --setup-smoke --no-audio 2>&1 | tee "$SMOKE_LOG"
          # Godot exits 0 after script parse errors; apply the validate.sh log check.
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|^ERROR:' "$CHECK_LOG" "$SMOKE_LOG"; then echo 'Portable setup reported a script error' >&2; exit 1; fi
          if ! grep -q 'PORTABLE_SETUP_SMOKE: PASS' "$SMOKE_LOG"; then echo 'Portable setup smoke receipt missing' >&2; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Abrams-${{ runner.os }}-x86_64
          path: |
            builds/*.zip
            builds/*.tar.gz
          if-no-files-found: error
          retention-days: 14
